[project]
name = "paperlesslabelagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.10",
    "langchain>=1.3.14",
    "langchain-ollama>=1.1.0",
    "python-dotenv>=1.2.2",
    "pymupdf>=1.28.0",
    "requests>=2.34.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
